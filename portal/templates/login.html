{% extends "base.html" %}
{% block title %}Вход — {{ brand_name }}{% endblock %}

{% block content %}
<section class="card">
  <h1>Вход</h1>
  <p class="muted">Пришлём код на почту — пароль не нужен.</p>

  <form method="post" action="/login" class="form">
    {# Код приглашения из реферальной ссылки едет скрытым полем до конца входа. #}
    {% if referral_code %}<input type="hidden" name="ref" value="{{ referral_code }}">{% endif %}
    <label for="email">Почта</label>
    <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
           required autofocus value="{{ email or '' }}">
    <button type="submit">Получить код</button>
  </form>
</section>
{% endblock %}
