# Портал на отдельной ВПС: сам портал, его Redis и Caddy с автоматическим TLS.
# Бот тут не поднимается — портал ходит в его API через туннель WireGuard.
services:
  portal:
    build:
      # Контекст — каталог portal/, а не корень репозитория: там корневой
      # .dockerignore исключает portal/ целиком (см. deploy/Dockerfile).
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORTAL_REDIS_URL: redis://portal_redis:6379/0
    depends_on:
      portal_redis:
        condition: service_healthy
    networks: [portal]

  portal_redis:
    image: redis:8-alpine
    container_name: portal_redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [portal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Домен нужен самому Caddy: Caddyfile разворачивает {$PORTAL_DOMAIN} из его
    # окружения, а не из окружения портала. Без этой переменной подстановка даёт
    # пустую строку, первая строка Caddyfile превращается в одинокую `{`, Caddy
    # читает её как блок глобальных настроек и падает на «unrecognized global
    # option: encode». `:?` — чтобы про незаполненный .env сказал compose, пока
    # понятно, в чём дело.
    environment:
      PORTAL_DOMAIN: '${PORTAL_DOMAIN:?не задан в portal/deploy/.env}'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [portal]
    networks: [portal]

volumes:
  caddy_data:
  caddy_config:

networks:
  portal:
